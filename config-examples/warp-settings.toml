# Merge these tables into your profile; do not replace unrelated settings.
[appearance.vertical_tabs]
enabled = true
primary_info = "command"

[agents]
cloud_conversation_storage_enabled = false

[agents.warp_agent]
is_any_ai_enabled = false

[agents.warp_agent.input]
nld_in_terminal_enabled = false

[agents.warp_agent.other]
show_agent_notifications = false
show_conversation_history = false

[agents.third_party]
should_render_cli_agent_toolbar = true
cli_agent_toolbar_enabled_commands = { '(^|[ /])pivo(\s|$)' = "OpenCode" }

[account]
is_settings_sync_enabled = false

[general]
default_session_mode = "terminal"
